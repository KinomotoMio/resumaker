      - title: Acme 科技
        subtitle: 后端工程师
        meta: 上海
        period: 2024.07 – 至今
        summary: 直播互动平台基础架构组，负责实时消息网关与弹幕系统。
        bullets:
          - text: 主导 WebSocket 网关连接模型重构（每连接一协程 → epoll + 协程池），**P99 延迟 320ms → 85ms**，单机承载连接数提升约 3 倍
            from: 2025-03-ws-gateway-perf
          - text: 设计弹幕分级限流与降级策略，晚高峰峰值 **12 万条/秒** 下核心房间零丢弃，相关投诉下降 **60%**
            from: 2025-06-danmaku-ratelimit
          - text: 推动网关接入 OpenTelemetry 全链路追踪，线上问题平均定位时间由小时级缩短到 **15 分钟内**
            from: 2025-09-gateway-otel
          - text: 牵头制定网关灰度发布与回滚规范，联合 3 个业务组完成全量迁移，迁移期间 **零 P1 事故**
            from: 2025-04-gateway-rollout
          - text: 带 2 名新人完成 onboarding，沉淀网关故障排查手册 12 篇，成为组内值班标准文档
            from: 2025-11-oncall-handbook
      - title: 星火数据
        subtitle: 后端开发实习生
        meta: 杭州
        period: 2023.06 – 2023.09
        bullets:
          - text: 为数据同步服务实现基于 Kafka 的增量订阅，替换原定时全量拉取，同步延迟由 10 分钟降至 **秒级**
            from: 2023-08-kafka-cdc
          - text: 编写数据一致性校验工具，按表抽样比对上下游，发现并修复 **3 类** 历史脏数据问题
            from: 2023-09-consistency-checker

